name: CI

# Runs automatically on every push and every pull request to main.
# This is the "CI" (Continuous Integration) part of MLOps: catch
# broken code BEFORE it merges, not after.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest fastapi uvicorn pydantic pandas lightgbm scikit-learn joblib httpx

      - name: Run test suite
        run: pytest tests/ -v

  docker-build:
    name: Validate Docker image builds
    runs-on: ubuntu-latest
    # Only bother building Docker if tests actually passed - no point
    # building an image for code we already know is broken.
    needs: test
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Build Docker image
        # This uses GitHub's own Docker engine - it doesn't touch your
        # laptop or need Docker installed locally at all.
        run: docker build -t coding-mentor-api .